    <h1>動画のかんたん確認を開いています</h1>
    <p>ニックネームを入力すると、動画と質問に進みます。動画ファイルの選択や時刻の入力はありません。</p>
    <p>各質問で「説明の主張が合っているか」と「質問に答える根拠として十分か」を別々に選びます。次の人はボタンを押してニックネームを入力し、Enterで質問を始めます。最後に全員分を1つのJSONで保存できます。保存後はブラウザーのダウンロード一覧で完了を確認してください。自動で開かない場合は<a href="../data/private_nextgqa/quick_review_ja_simple_20261019_itemid_v7.html">こちらを開いてください</a>。</p>
