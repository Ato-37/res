    <h1>GPU生成した説明のかんたん確認を開いています</h1>
    <p>ニックネームを入力すると、動画と質問に進みます。質問の分かりやすさ、説明の答えが動画に合っているか、説明が動画中の根拠を十分に示しているかを、それぞれ選びます。</p>
    <p>これは3件の予備確認です。完全な幻覚判定や正式レビューではなく、回答だけでfaithfulness評価を確定するものでもありません。次の人は「次の人へ」を押して自分のニックネームを入力できます。最後に全員分をまとめてJSONで保存してください。回答にはニックネームが含まれるため、実名を使わず、ファイルを共有・公開しないでください。</p>
    <p>自動で開かない場合は<a href="../data/private_nextgqa/quick_review_v2short_20261021_01.html">こちらを開いてください</a>。</p>
